services:
  mysql:
    image: mysql:8.4
    container_name: order-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: order-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: order
      RABBITMQ_DEFAULT_PASS: order123456
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: order-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: order_db
      DB_USER: order_user
      DB_PASSWORD: order_pass
      RABBIT_HOST: rabbitmq
      RABBIT_USER: order
      RABBIT_PASSWORD: order123456
      EXPORT_FILE_DIR: /app/data/export   # 导出 xlsx 保留目录（命名卷持久化，容器重建后文件仍在）
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - export-files:/app/data/export
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: order-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  rabbitmq-data:
  export-files:
